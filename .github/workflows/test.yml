name: Beta validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - name: Linux collector smoke test
        run: python3 scoring_matrix.py --output /tmp/scoring-matrix-reports
      - name: Install, validate desktop entry, uninstall
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          python3 install.py
          desktop-file-validate "$HOME/.local/share/applications/scoring-matrix.desktop"
          python3 install.py --uninstall
